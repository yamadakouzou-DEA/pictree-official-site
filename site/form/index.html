<style>
:root{--navy:#11385F;--blue:#1C5AA2;--blue2:#127FEB;--sky:#EFF5FC;--yellow:#F2B61C;--ink:#1B2733;--ink2:#4A5563;--ink3:#6B7684;--line:#D5DEE8;--white:#fff;--r:16px;
--fb:"Noto Sans JP","Zen Kaku Gothic New",system-ui,sans-serif;--fd:"Zen Kaku Gothic New","Noto Sans JP",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--fb);line-height:1.85;-webkit-font-smoothing:antialiased}
a{color:var(--blue2)}

.meta{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--ink3);margin-bottom:10px}
.tag{background:var(--yellow);color:var(--navy);font-weight:700;border-radius:999px;padding:1px 12px;font-size:12px}
h1{font-family:var(--fd);font-weight:900;font-size:clamp(22px,3.2vw,30px);line-height:1.45;margin:0 0 24px;color:var(--navy)}
.hero{width:100%;height:auto;border-radius:12px;margin:0 0 28px;display:block}
.body p{margin:0 0 1em}
.body img{max-width:100%;height:auto;border-radius:8px}
.body figure{margin:20px 0}
.body .sp{height:28px}
.body h2,.body h3{font-family:var(--fd);color:var(--navy);line-height:1.5}
.body table{border-collapse:collapse;width:100%;font-size:14px}
.body td,.body th{border:1px solid var(--line);padding:8px 10px}
.body .wp-block-button__link{display:inline-block;background:var(--blue2);color:#fff;text-decoration:none;font-weight:700;padding:10px 22px;border-radius:999px}
.back{display:inline-block;margin-top:32px;font-weight:700;text-decoration:none;color:var(--navy);border:2px solid var(--navy);border-radius:999px;padding:8px 22px;box-shadow:0 3px 0 var(--navy);background:#fff}
footer{background:var(--navy);color:#DCE6F2;padding:40px 0 28px;font-size:13px}
footer .cols{display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between;align-items:flex-start}
footer .brand img{height:28px;filter:brightness(0) invert(1)}
footer .brand p{margin:8px 0 0}
footer ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px 18px}
footer a{color:#DCE6F2;text-decoration:none}
footer a:hover{text-decoration:underline}
footer .copy{margin-top:24px;color:#9FB3C8;font-size:12px}

.body h3{font-size:17px;margin:2em 0 .6em;padding-left:10px;border-left:4px solid var(--yellow)}
.p-faq__ctg{font-family:var(--fd);font-weight:900;color:var(--navy);font-size:20px;margin:36px 0 12px}
.p-faq__list{list-style:none;padding:0;margin:0}
.p-faq__list__item{list-style:none;border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin:0 0 10px;background:#fff}
.p-faq__list__item__title{font-weight:700;color:var(--navy)}
.p-faq__list__item__title::before{content:"Q. ";color:var(--blue2)}
.p-faq__list__item__cap{margin:8px 0 0;color:var(--ink2)}
.form dl{margin:0 0 18px}.form dd{margin:0}
.body li:empty{display:none}.body ul{padding-left:1.2em}.body li{margin:0 0 12px}.form dt{font-weight:700;margin-bottom:6px}.form dt span{color:#B4432F;font-size:12px;margin-left:8px}
.form input[type=text],.form input[type=email],.form textarea{width:100%;font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px}
.form button{font:inherit;font-weight:700;background:var(--blue2);color:#fff;border:2px solid var(--navy);border-radius:999px;padding:10px 32px;box-shadow:0 3px 0 var(--navy);cursor:pointer}
.form .hp{display:none}
@media (max-width:720px){.nav ul{display:none}article{padding:24px 18px}}
